# Generated by Rostrum from the default scene "Live". Edits are overwritten.
# Each native PipeWire app reads this when it starts.
# While Rostrum runs it routes apps itself. If a bus is missing, WirePlumber uses the
# default sink.
# Each rule matches playback streams only, so the app's recordings keep their microphone.
stream.rules = [
    {
        matches = [ { media.class = "Stream/Output/Audio" application.process.binary = "~^[Dd][Ii][Ss][Cc][Oo][Rr][Dd]$" } ]
        actions = { update-props = { target.object = "rostrum.voice" } }
    }
    {
        matches = [ { media.class = "Stream/Output/Audio" application.name = "~^[Ff][Ii][Rr][Ee][Ff][Oo][Xx]$" } ]
        actions = { update-props = { target.object = "rostrum.music" } }
    }
    {
        matches = [ { media.class = "Stream/Output/Audio" application.name = "~^[Hh][Aa][Ll][Ff]-[Ll][Ii][Ff][Ee] 2 \\([Xx]64\\)$" } ]
        actions = { update-props = { target.object = "rostrum.game" } }
    }
    {
        matches = [ { media.class = "Stream/Output/Audio" application.name = "~^[Bb][Oo][Bb]'[Ss] \"[Rr][Aa][Dd][Ii][Oo]\" 1\\.0$" } ]
        actions = { update-props = { target.object = "rostrum.music" } }
    }
]
