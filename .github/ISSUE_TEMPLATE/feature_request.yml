name: Feature request
description: Suggest something Rostrum should do, or do differently.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search the
        [existing issues](https://github.com/rostrum-audio/rostrum/issues) first, and add a 👍
        to a matching one instead of opening a new one.

        Rostrum is a stream mix console, not a patchbay: it hides the PipeWire graph behind
        buses, faders and scenes. Ideas that keep it simple for someone who is live on stream
        fit best.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: When I switch from gaming to just chatting, I have to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How should Rostrum solve it? Describe what you would see and do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Anything you tried, or other tools that do this well.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mixer, buses and faders
        - Apps and automatic assignment
        - Scenes
        - Devices and headphones
        - OBS
        - Tray, hotkeys and startup
        - First-time setup
        - Settings, crash reports and updates
        - Accessibility
        - Documentation
        - Something else
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Your setup, mockups or screenshots, links. Please leave out personal data.
