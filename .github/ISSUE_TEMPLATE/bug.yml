name: Bug
description: Something failed on a Linux desktop running PipeWire.
title: ""
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and version
      placeholder: Kubuntu 26.04, Fedora 42, Arch, openSUSE Slowroll
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop and session
      placeholder: Plasma 6 on Wayland, GNOME on Wayland, X11
  - type: input
    id: audio
    attributes:
      label: PipeWire and WirePlumber versions
      placeholder: pipewire 1.6.2, wireplumber 0.5.13
