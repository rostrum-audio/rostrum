name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Ubuntu unit tests
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 ships Qt 6.4; Rostrum needs Qt 6.5+.
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates build-essential cmake ninja-build pkg-config \
            qt6-base-dev libpipewire-0.3-dev libtomlplusplus-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DROSTRUM_BUILD_APP=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fedora:
    name: Fedora build
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            git cmake ninja-build gcc-c++ pkgconf-pkg-config \
            qt6-qtbase-devel pipewire-devel tomlplusplus-devel
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DROSTRUM_BUILD_APP=OFF -DROSTRUM_BUILD_TESTS=OFF
          cmake --build build

  arch:
    name: Arch build
    runs-on: ubuntu-24.04
    continue-on-error: true
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git cmake ninja gcc pkgconf qt6-base pipewire tomlplusplus
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DROSTRUM_BUILD_APP=OFF -DROSTRUM_BUILD_TESTS=OFF
          cmake --build build
